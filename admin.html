<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Docházka</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 20px;
      margin-right: 10px;
    }
    #code {
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 8px;
      margin: 20px 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #f3f4f6;
    }
  </style>
</head>
<body>
  <h1>Admin Docházka</h1>
  
  <button onclick="startSession()">Spustit novou hodinu</button>
  
  <div id="code">----</div>
  <p id="countdown">Není spuštěná hodina.</p>
  <p id="error" role="status" style="color: #b91c1c"></p>
  
  <h2>Všichni žáci</h2>
  
  <table>
    <thead>
      <tr>
        <th>Jméno</th>
        <th>Stav</th>
        <th>Čas příchodu</th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>

  <script>
    async function startSession() {
      try {
        const res = await fetch('/api/start', { method: 'POST' });
        const data = await res.json();
        
        if (data.code) {
          document.getElementById('code').textContent = data.code;
          loadList();
        } else {
          alert('Chyba při generování kódu');
        }
      } catch (err) {
        alert('Chyba připojení');
      }
    }

    let loading = false;
    let expiresAt = null;
    let serverOffset = 0;
    let hasSession = false;

    function updateCountdown() {
      const el = document.getElementById('countdown');
      if (!hasSession) {
        el.textContent = 'Není spuštěná hodina.';
        return;
      }
      const seconds = Math.max(0, Math.ceil((expiresAt - Date.now() - serverOffset) / 1000));
      el.textContent = seconds > 0
        ? `Do konce přihlášení: ${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`
        : 'Přihlášení je uzavřené. Časový limit vypršel.';
    }

    function formatTime(value) {
      if (!value) return '—';
      // SQLite CURRENT_TIMESTAMP ukládá UTC bez označení časového pásma.
      const iso = value.includes('T') ? value : value.replace(' ', 'T') + 'Z';
      const date = new Date(iso);
      return Number.isNaN(date.getTime()) ? '—' : date.toLocaleTimeString('cs-CZ', { timeZone: 'Europe/Prague' });
    }

    async function loadList() {
      if (loading) return;
      loading = true;
      try {
        const res = await fetch('/api/list', { cache: 'no-store' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Chyba při načítání');
        document.getElementById('code').textContent = data.code || '----';
        expiresAt = data.expiresAt;
        hasSession = Boolean(data.code);
        serverOffset = data.serverNow - Date.now();
        updateCountdown();
        const tbody = document.getElementById('list');
        tbody.replaceChildren();
        data.students.forEach(row => {
          const tr = document.createElement('tr');
          [row.name, row.present ? 'Tu' : 'Není tu', formatTime(row.created_at)].forEach(value => {
            const td = document.createElement('td');
            td.textContent = value;
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        document.getElementById('error').textContent = '';
      } catch (err) {
        document.getElementById('error').textContent = 'Seznam se nepodařilo aktualizovat. Zobrazené údaje mohou být zastaralé.';
      } finally {
        loading = false;
      }
    }

    loadList();
    setInterval(loadList, 5000);
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
