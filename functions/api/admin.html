<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Docházka</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    #code {
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 8px;
      margin: 20px 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #f3f4f6;
    }
  </style>
</head>
<body>
  <h1>Admin Docházka</h1>
  
  <button onclick="startSession()">Spustit novou hodinu</button>
  
  <div id="code">----</div>
  
  <h2>Přítomní studenti</h2>
  <button onclick="loadList()">Obnovit seznam</button>
  
  <table>
    <thead>
      <tr>
        <th>Jméno</th>
        <th>Čas</th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>

  <script>
    async function startSession() {
      const res = await fetch('/api/start', { method: 'POST' });
      const data = await res.json();
      document.getElementById('code').textContent = data.code;
      loadList();
    }

    async function loadList() {
      const res = await fetch('/api/list');
      const data = await res.json();
      
      const tbody = document.getElementById('list');
      tbody.innerHTML = '';
      
      data.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${row.name}</td><td>${new Date(row.created_at).toLocaleTimeString('cs')}</td>`;
        tbody.appendChild(tr);
      });
    }

    // Načti seznam při otevření
    loadList();
  </script>
</body>
</html>
