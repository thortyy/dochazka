<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docházka</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 400px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    #message {
      margin-top: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Docházka</h1>
  
  <label for="name">Jméno a příjmení</label>
  <input type="text" id="name" placeholder="Zadej své jméno a příjmení" autocomplete="name" aria-describedby="name-help" required>
  <p id="name-help">Napiš celé jméno a příjmení, např. Josef Kuchař. Přihlášení je otevřené 10 minut od spuštění hodiny učitelem.</p>
  <input type="text" id="code" placeholder="Kód hodiny" required>
  <button id="btn" onclick="checkIn()">Jsem tady</button>
  
  <div id="message"></div>

  <script>
    // Zkontroluj, jestli už se z tohoto počítače na aktuální kód zapsal
    function alreadyCheckedIn(code) {
      const saved = localStorage.getItem('dochazka_code');
      return saved === code.toUpperCase();
    }

    async function checkIn() {
      const name = document.getElementById('name').value.trim();
      const code = document.getElementById('code').value.trim().toUpperCase();
      const message = document.getElementById('message');
      const btn = document.getElementById('btn');

      if (!name || !code) {
        message.textContent = 'Vyplň jméno, příjmení a kód hodiny';
        message.style.color = 'red';
        return;
      }

      if (alreadyCheckedIn(code)) {
        message.textContent = 'Z tohoto počítače už jsi zapsán';
        message.style.color = 'orange';
        btn.disabled = true;
        return;
      }

      try {
        const res = await fetch('/api/checkin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, code })
        });

        const data = await res.json();

        if (res.ok) {
          // Ulož, že z tohoto počítače už byl tento kód použit
          localStorage.setItem('dochazka_code', code);
          
          message.textContent = 'Úspěšně zapsáno!';
          message.style.color = 'green';
          btn.disabled = true;
        } else {
          message.textContent = data.error || 'Chyba';
          message.style.color = 'red';
        }
      } catch (err) {
        message.textContent = 'Chyba připojení';
        message.style.color = 'red';
      }
    }
  </script>
</body>
</html>
